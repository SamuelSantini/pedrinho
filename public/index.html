<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <p class="eyebrow">CRUD</p>
            <h1>Alunos</h1>
        </header>

        <section>
            <h2>Ver</h2>
            <button id="btn-listar">Listar</button>
            <div id="lista"></div>
        </section>

        <section>
            <h2>Cadastrar</h2>
            <input id="cad-nome" placeholder="nome">
            <input id="cad-email" placeholder="email">
            <input id="cad-senha" placeholder="senha">
            <button id="btn-cadastrar">Cadastrar</button>
        </section>

        <section>
            <h2>Atualizar</h2>
            <input id="atualizar-id" placeholder="id">
            <input id="atualizar-nome" placeholder="nome">
            <input id="atualizar-email" placeholder="email">
            <input id="atualizar-senha" placeholder="senha">
            <button id="btn-atualizar">Atualizar</button>
        </section>

        <section>
            <h2>Apagar</h2>
            <input id="deletar-id" placeholder="id">
            <button id="btn-apagar" class="danger">Apagar</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
